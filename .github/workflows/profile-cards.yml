name: Refresh profile cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - "assets/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install font tooling
        run: pip install -r requirements.txt

      - name: Refresh contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_readme_cards.py

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          if git diff --cached --quiet; then
            echo "cards already up to date"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
